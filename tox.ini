[tox]
envlist = django52-drf{314,latest}, docs, quality
requires =
    tox-uv>=1

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
ignore = E501,W503

[pydocstyle]
ignore = D101,D200,D203,D212
match-dir = (?!migrations)

[pytest]
DJANGO_SETTINGS_MODULE = completion.settings.test_settings
addopts = --cov completion --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    drf314: drf314
    drflatest: test
commands =
    python -Wd -m pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups =
    doc
setenv =
    DJANGO_SETTINGS_MODULE = completion.settings.test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/completion.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
setenv =
    DJANGO_SETTINGS_MODULE=completion.settings.test_settings
allowlist_externals =
    make
    rm
    touch
commands =
    pylint completion
    pycodestyle completion
    make selfcheck
    rm -rf dist/*
    python -m build
    twine check dist/*

